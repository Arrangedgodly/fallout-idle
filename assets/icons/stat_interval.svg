  <g fill="none" stroke="#20334F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="64" cy="72" r="30"/>
    <rect x="55" y="26" width="18" height="12" rx="3" fill="#F2EDE3" stroke-width="6"/>
    <line x1="64" y1="72" x2="78" y2="58"/>
    <line x1="64" y1="72" x2="64" y2="56" stroke-width="6"/>
  </g>
</svg>
