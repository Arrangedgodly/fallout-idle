<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Valued Resident - DEPUTIZE button glyph: ID-tag with plus, amber ink on the Energized plate (consumed by the T17 DEPUTIZE RESIDENT button). Rule: echoes the verb beside the label, never replaces the word. Original stencil-line signage icon (T19). -->
  <rect x="6" y="6" width="116" height="116" rx="14" fill="#F2EDE3" stroke="#20334F" stroke-width="8"/>
  <g fill="none" stroke="#20334F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="42" y="44" width="44" height="52" rx="6" fill="#F2EDE3"/>
    <line x1="58" y1="44" x2="58" y2="30" stroke-width="6"/>
    <line x1="70" y1="44" x2="70" y2="30" stroke-width="6"/>
    <line x1="52" y1="44" x2="76" y2="44" stroke-width="6"/>
  </g>
  <g fill="none" stroke="#FFB000" stroke-width="8" stroke-linecap="round">
    <line x1="98" y1="26" x2="98" y2="50"/>
    <line x1="86" y1="38" x2="110" y2="38"/>
  </g>
</svg>
