  <g fill="none" stroke="#20334F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 26 98 L 26 82 L 52 82 L 52 64 L 78 64 L 78 46 L 102 46 L 102 98 Z" fill="#F2EDE3"/>
  </g>
