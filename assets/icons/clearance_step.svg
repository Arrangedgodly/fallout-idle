  <!-- Valued Resident - Clearance glyph: rising three-step staircase (NEVER a padlock - voice rule 3, clearance language only). Rule: marks any gated card beside the required grade number; red-linework variant is reserved for an actively locked gate off the danger plate. Original stencil-line signage icon (T19). -->
